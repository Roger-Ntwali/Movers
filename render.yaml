# Render Blueprint — deploys the API and the static frontend from this one
# file. See https://render.com/docs/blueprint-spec
#
# The database is NOT managed here — production uses a Neon Postgres
# database (DATABASE_URL is set manually in the Render dashboard, see
# README.md's "Deploying" section).
#
# All commands run from the repo root (npm workspaces monorepo), so the
# shared package is built once and reused by both apps.
services:
  - type: web
    name: movers-rwanda-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: npm run db:migrate && npm run --workspace apps/api start
    envVars:
      - key: NODE_ENV
        value: production
      # Set to your production Neon connection string (include ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set after the frontend's URL is known, e.g. https://moversrwanda.com
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: movers-rwanda-web
    runtime: static
    buildCommand: npm install && npm run build:shared && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      # Set to the deployed API's URL, e.g. https://movers-rwanda-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
