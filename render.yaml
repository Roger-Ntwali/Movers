# Render Blueprint — deploys the API from this one file.
# See https://render.com/docs/blueprint-spec
#
# The frontend (apps/web) deploys separately to Vercel — see vercel.json.
# The database is NOT managed here — production uses a Neon Postgres
# database (DATABASE_URL is set manually below, see README.md's "Deploying"
# section).
#
# Build runs from the repo root (npm workspaces monorepo), so the shared
# package is built before the api.
services:
  - type: web
    name: movers-rwanda-api
    runtime: node
    plan: starter
    # --include=dev is required: NODE_ENV=production (set below) makes plain
    # `npm install` skip devDependencies, which breaks the TypeScript build
    # (tsc, @types/*) that only apps/api's devDependencies provide.
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:api
    startCommand: npm run db:migrate && npm run --workspace apps/api start
    envVars:
      - key: NODE_ENV
        value: production
      # Set to your production Neon connection string (include ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set to your Vercel deployment's URL, e.g. https://moversrwanda.vercel.app
      # (and your custom domain once it's attached), comma-separated.
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
